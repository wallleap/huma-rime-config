# encoding: utf-8
schema:
  schema_id: tiger_sentence
  name: 虎码·整句
  ascii_icon: "icons/en.ico" # 小狼毫输入状态图标
  full_icon: "icons/full.ico"
  half_icon: "icons/half.ico"
  # icon: "icons/tiger.ico"
  icon: "icons/tiger_sentence.ico"
  version: "1.0"
  author:
    - TigerClaw
  dependencies:
    - flypy
  description: |
    从虎整句常用字词表生成的变长整句方案。
    光秃编码只取第 1 候选；分号/引号/数字写入编码选重。
    首次输入时用 Lua 加载 sentence-ngram-v2.bin 做 Kneser-Ney 打分。
    敲 ` 鍵進入小鹤双拼反查。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: pinyin
    reset: 1
    states: [拼, pīn]
  - name: chaifen
    reset: 1
    states: [拆隐, 拆显]
  - name: emoji_cn
    reset: 0
    states: [🈚, 🈶]
  - name: ascii_punct
    states: [。，, ．，]
  - name: full_shape
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@tiger_sentence_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@flypy_reverse_lookup
    - lua_translator@tiger_sentence_translator
  filters:
    - lua_filter@pinyin_comment_filter
    - lua_filter@chaifen_comment_filter
    - simplifier@emoji_cn
    - uniquifier

speller:
  # alphabet: "zyxwvutsrqponmlkjihgfedcba;';0123456789`"
  alphabet: "['zyxwvutsrqponmlkjihgfedcba]`/=S" # 定义本方案输入键 "[;'zyxwvutsrqponmlkjihgfedcba]`"
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " "
  auto_select: false

translator:
  dictionary: tiger_sentence
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_completion: false

# 小鹤双拼反查
flypy_reverse_lookup:
  dictionary: flypy
  prefix: "`"
  tips: "〔小鹤双拼〕"
  preedit_format:
    - "xform/^`//"
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/【/"
    - "xform/$/】/"
  tag: flypy_lookup
  extra_tags: [reverse_lookup]
  overwrite_comment: false

# 拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tips: char
  tags:
    - abc
    - reverse_lookup

# 拆分滤镜
chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tags:
    - abc
    - reverse_lookup
  tips: all

# Emoji 表情滤镜
emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

menu:
  page_size: 5

key_binder:
  bindings: # 设置功能性快捷键
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/select_candidate
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/paging_with_brackets
      - key_bindings:/windows_compatible_mode_switch
      - key_bindings:/tiger_pc_options
      # - key_bindings:/tiger_mobile_options

punctuator:
  import_preset: symbols

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^`[a-z]*'?$"
    flypy_lookup: "^`[a-z]*'?$"

