# encoding: utf-8
schema:
  schema_id: tiger_sentence
  name: 虎码·整句
  ascii_icon: "icons/en.ico" # 小狼毫输入状态图标
  full_icon: "icons/full.ico"
  half_icon: "icons/half.ico"
  # icon: "icons/tiger.ico"
  icon: "icons/tiger_sentence.ico"
  version: "1.1"
  author:
    - TigerClaw
  dependencies:
    - flypy
    - easy_english
  description: |
    从虎整句常用字词表生成的变长整句方案。
    整段不超过 4 码时检索该码位全部字词，首选排在非首选前面；
    超过 4 码后光秃编码只取第 1 候选。分号/引号/数字写入编码选重。
    首次输入时用 Lua 优先分页加载 sentence-ngram-mobile.bin 做 Kneser-Ney 打分。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: pinyin
    states: [拼, pīn]
  - name: chaifen
    states: [拆隐, 拆显]
  - name: tiger_sentence_early_commit
    reset: 1
    states: [ 提前上屏关, 提前上屏开 ]
  - name: emoji_cn
    reset: 0
    states: [🈚, 🈶]
  - name: simplification # 简转繁滤镜
    reset: 0
    states: [简中, 繁中]
  - name: charset_comment_filter # 字符集提示
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]
  - name: ascii_punct
    reset: 0
    states: [。，, ．，]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@switcher_processor
    - lua_processor@tiger_sentence_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - affix_segmentor@easy_english
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@flypy_reverse_lookup
    - table_translator@easy_english
    - history_translator@historyDM # 重复上屏 电脑
    - history_translator@historyDM2 # 重复上屏 电脑2
    - history_translator@historyDM3 # 重复上屏 电脑3
    - history_translator@historySJ # 重复上屏 手机
    - lua_translator@tiger_sentence_translator
    - lua_translator@number_translator
    - lua_translator@calculator_translator
    - lua_translator@switcher_translator
    - lua_translator@*helper
    - lua_translator@*uuid_translator
    - lua_translator@*date_translator
    - lua_translator@*input_statistics
  filters:
    - simplifier@simplification # 用字转换，简繁滤镜
    - lua_filter@pinyin_comment_filter
    - lua_filter@chaifen_comment_filter
    - simplifier@emoji_cn
    - lua_filter@switcher_filter
    - lua_filter@charset_comment_filter # Unicode分区提示滤镜
    - lua_filter@lua_unicode_display_filter # Unicode编码显示
    - uniquifier

speller:
  # alphabet: "zyxwvutsrqponmlkjihgfedcba;';0123456789`"
  alphabet: "['zyxwvutsrqponmlkjihgfedcba]`/=S]" # 定义本方案输入键 "[;'zyxwvutsrqponmlkjihgfedcba]`"
  # initials: "abcdefghijklmnopqrstuvwxyz" # 不设则默认等于 alphabet，使 / 等特殊字符也能作首码进入缓冲区，等后续输入触发 recognizer
  delimiter: " "
  auto_select: false

translator:
  dictionary: tiger_sentence
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_completion: false

# 小鹤双拼反查
flypy_reverse_lookup:
  dictionary: flypy
  prefix: "`"
  tips: "〔小鹤双拼〕"
  preedit_format:
    - "xform/^`//"
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/【/"
    - "xform/$/】/"
  tag: flypy_lookup
  extra_tags: [reverse_lookup]
  overwrite_comment: false

# 拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tips: char
  tags:
    - abc
    - reverse_lookup

# 拆分滤镜
chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tags:
    - abc
    - reverse_lookup
  tips: all

# Emoji 表情滤镜
emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

# 简繁(+部分异体)滤镜
simplification:
  opencc_config: st_tu.json # 简 ➡ 繁·异（秃版标准）
  option_name: simplification
  tips: all

# 临时英文
easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: 〔En〕
  enable_completion: true
  enable_sentence: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format:
    - "xform/~/ /"

historySJ:
  input: "z"
  size: 1
  initial_quality: 0

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

menu:
  page_size: 5

key_binder:
  bindings: # 设置功能性快捷键
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/select_candidate
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/paging_with_brackets
      - key_bindings:/windows_compatible_mode_switch
      - key_bindings:/tiger_pc_options
      # - key_bindings:/tiger_mobile_options

punctuator:
  import_preset: symbols

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    reverse_lookup: "^`[a-z]*'?$"
    flypy_lookup: "^`[a-z]*'?$"
    easy_english: "^'[A-Z|a-z]*`?$"
    expression: "^=.*$"
    number: "^S[0-9]*$"
    stats: "^tj(rt|zt|yt|nt|qk)$"
    help: "^help$" # 帮助输入信息识别模式

# ascii_composer:
#   good_old_caps_lock: true
#   switch_key:
#     Caps_Lock: clear
#     Shift_L: commit_code
#     Shift_R: commit_code
#     Control_L: noop
#     Control_R: noop

