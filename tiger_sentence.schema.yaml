# encoding: utf-8
schema:
  schema_id: tiger_sentence
  name: 虎码·整句
  ascii_icon: "icons/en.ico" # 小狼毫输入状态图标
  full_icon: "icons/full.ico"
  half_icon: "icons/half.ico"
  # icon: "icons/tiger.ico"
  icon: "icons/tiger_sentence.ico"
  version: "1.0"
  author:
    - TigerClaw
  dependencies:
    - flypy
  description: |
    从虎整句常用字词表生成的变长整句方案。
    光秃编码只取第 1 候选；分号/引号/数字写入编码选重。
    首次输入时用 Lua 加载 sentence-ngram-v2.bin 做 Kneser-Ney 打分。
    敲 ` 鍵進入小鹤双拼反查。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: pinyin
    states: [拼, pīn]
  - name: chaifen
    states: [拆隐, 拆显]
  - name: ascii_punct
    states: [。，, ．，]
  - name: full_shape
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@tiger_sentence_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@flypy_reverse_lookup
    - lua_translator@tiger_sentence_translator
  filters:
    - lua_filter@pinyin_comment_filter
    - lua_filter@chaifen_comment_filter
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba;';0123456789`"
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " "
  auto_select: false

translator:
  dictionary: tiger_sentence
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_completion: false

# 小鹤双拼反查
flypy_reverse_lookup:
  dictionary: flypy
  prefix: "`"
  tips: "〔小鹤双拼〕"
  preedit_format:
    - "xform/^`//"
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/【/"
    - "xform/$/】/"
  tag: flypy_lookup
  extra_tags: [reverse_lookup]
  overwrite_comment: false

# 拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tips: char
  tags:
    - abc
    - reverse_lookup

# 拆分滤镜
chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tags:
    - abc
    - reverse_lookup
  tips: all

menu:
  page_size: 5

key_binder:
  bindings:
    - { when: has_menu, accept: Tab, send: Down }
    - { when: has_menu, accept: Shift+Tab, send: Up }
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

punctuator:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^`[a-z]*'?$"
    flypy_lookup: "^`[a-z]*'?$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
