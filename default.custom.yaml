# Rime default settings patch: default.custom.yaml Rime 默认设置补丁
# encoding: utf-8
# https://github.com/lotem/rimeime/blob/master/brise/default.yaml
# https://github.com/rime/librime/blob/master/data/minimal/default.yaml
# patch:
#   "一级设置项/二级设置项/三级设置项": 新的设置值
#   "另一个设置项": 新的设置值
#   "再一个设置项": 新的设置值
#   "含列表的设置项/@0": 列表第一个元素新的设置值，0 可替换为其他数字
#   "含列表的设置项/@last": 列表最后一个元素新的设置值
#   "含列表的设置项/@before 0": 在列表第一个元素之前插入新的设置值（不建议在补丁中使用）
#   "含列表的设置项/@after last": 在列表最后一个元素之后插入新的设置值（不建议在补丁中使用）
#   "含列表的设置项/@next": 在列表最后一个元素之后插入新的设置值（不建议在补丁中使用）

patch:
  # 方案列表
  schema_list:
    - schema: tiger
    - schema: tigress
    - schema: flypy

  # 切换器配置
  "switcher/caption": "〔方案菜单〕" # 方案切换菜单标题
  "switcher/hotkeys": # 方案切换热键
    - Control+grave
    - Control+Shift+grave
    - F4
  "switcher/save_options": # 保存方案切换选项
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  "switcher/fold_options": true # 折叠方案切换选项
  "switcher/abbreviate_options": true # 方案切换选项简写
  "switcher/option_list_separator": "/" # 方案切换选项分隔符

  # 候选项个数
  "menu/page_size": 9

  # 全角半角标点符号配置
  "punctuator/full_shape":
    __include: punctuation:/full_shape
  "punctuator/half_shape":
    __include: punctuation:/half_shape

  # 键盘按键绑定配置
  "key_binder/bindings":
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_brackets
      - key_bindings:/paging_with_minus_equal
      # - key_bindings:/numbered_mode_switch
      - key_bindings:/windows_compatible_mode_switch

  # 识别器配置
  "recognizer/patterns": # 方便输入英文字符或数字
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

  # ascii 输入配置（英文切换）
  "ascii_composer/good_old_caps_lock": false
  "ascii_composer/switch_key":
    # inline_ascii 临时输入英文，回车上屏后切换到中文状态
    # commit_text 候选文字上屏并切换到英文状态
    # commit_code 编码上屏并切换到英文状态
    # noop 屏蔽该切换键
    Caps_Lock: noop
    Control_L: noop
    Control_R: noop
    Eisu_toggle: clear
    Shift_L: commit_code
    Shift_R: commit_code
