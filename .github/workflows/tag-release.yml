name: Build Full Repository and Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 显示目录结构
      - name: Show directory structure
        run: |
          pwd
          ls -lh

      # 下载 wanxiang-lts-zh-hans.gram 语法文件
      - name: Download wanxiang grammar file
        run: |
          curl -L -o ./wanxiang-lts-zh-hans.gram \
          https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram

      # 下载 sentence-ngram-mobile.bin 语法文件
      - name: Download sentence-ngram-mobile grammar file
        run: |
          mkdir -p models
          curl -L -o ./models/sentence-ngram-mobile.bin \
          https://github.com/wallleap/huma-rime-config/releases/download/LTS/sentence-ngram-mobile.bin

      # 重命名示例文件
      - name: Rename custom_phrase.example.txt to custom_phrase.txt
        run: |
          if [ -f "custom_phrase.example.txt" ]; then
            mv custom_phrase.example.txt custom_phrase.txt
            echo "✅ Renamed successfully"
          else
            # 创建 custom_phrase.txt 文件到目录下
            echo -e "Rime 输入法\trime\t100" > ./custom_phrase.txt

            echo "ℹ️ No example file found, skip"
          fi

      # 定义统一变量（全局可用）
      - name: Set build variables
        id: vars
        run: |
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "PACKAGE=huma-rime-config" >> $GITHUB_OUTPUT
          echo "FOLDER=huma_rime_config" >> $GITHUB_OUTPUT

      # 打包：创建目录 + 移动文件（支持排除）+ 打包 tar.gz + zip
      - name: Package into folder + create tar.gz + zip
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          FOLDER=${{ steps.vars.outputs.FOLDER }}
          mkdir -p dist
          # mkdir -p "$FOLDER"
          mkdir -p tmp_base tmp_full

          shopt -s extglob

          # ====================== 排除规则 ======================
          # 在这里添加你不想打包的文件/文件夹
          # 格式：｜ 文件1｜文件2｜目录/｜等等
          # =======================================================
          GLOBAL_EXCLUDE="dist|tmp_base|tmp_full|.git|.github|.gitignore|.gitattributes|*.example.*|bin|models|README.md|changelog.txt|crawler.py|huma.recipe.yaml|LICENSE"

          # 1. huma font zip
          cp -r fonts/huma/ huma/
          zip -r9 "dist/huma-font.zip" huma/
          rm -rf huma

          # 2. pingfangmod font zip
          cp -r fonts/pingfangmod/ pingfangmod/
          zip -r9 "dist/pingfangmod-font.zip" pingfangmod/
          rm -rf pingfangmod
          
          # 3. t26_pure theme zip
          cp -r themes/t26_pure/ t26_pure/
          zip -r9 "dist/t26_pure-theme.zip" t26_pure/
          rm -rf t26_pure
          
          # 4. dvorak_pure theme zip
          cp -r themes/dvorak_pure/ dvorak_pure/
          zip -r9 "dist/dvorak_pure-theme.zip" dvorak_pure/
          rm -rf dvorak_pure

          # 5. 构建【基础包文件】tmp_base：排除fonts目录、万象gram模型文件
          mv !(fonts|wanxiang-lts-zh-hans.gram|$GLOBAL_EXCLUDE) tmp_base/
          # 将 tmp_base 重命名为 huma_rime_config 后打包基础 zip
          mv tmp_base "$FOLDER"
          zip -r9 "dist/${PACKAGE}.zip" "$FOLDER"
          tar -zcvf "dist/${PACKAGE}.tar.gz" "$FOLDER"
          mv "$FOLDER" tmp_base # 还原临时目录

          # 6. 构建【完整包文件】tmp_full：全部文件（基础文件+fonts+万象gram+models）
          mv tmp_base/* tmp_full/
          cp -r fonts tmp_full/
          cp wanxiang-lts-zh-hans.gram tmp_full/
          cp -r models tmp_full/
          mv tmp_full "$FOLDER"
          tar -zcvf "dist/${PACKAGE}-full.tar.gz" "$FOLDER"
          zip -r9 "dist/${PACKAGE}-full.zip" "$FOLDER"
          rm -rf "$FOLDER" tmp_base tmp_full # 清理临时打包目录

          # 7. 单独打包 fonts.zip（仅fonts文件夹）
          tar -zcvf "dist/fonts.tar.gz" fonts/
          zip -r9 "dist/fonts.zip" fonts/

          # 8. 单独打包万象模型文件
          mkdir -p gram
          mv wanxiang-lts-zh-hans.gram gram/
          tar -zcvf "dist/wanxiang-lts-zh-hans_gram.tar.gz" gram/
          zip -r9 "dist/wanxiang-lts-zh-hans_gram.zip" gram/
          rm -rf gram

          # 9. 单独打包 sentence-ngram-mobile.bin
          tar -zcvf "dist/sentence-ngram-mobile_bin.tar.gz" models/
          zip -r9 "dist/sentence-ngram-mobile_bin.zip" models/
          rm -rf models

          # 输出dist目录全部产物核对
          ls -lh dist/

      # 校验压缩包
      - name: Validate packages
        run: |
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          FILE_LIST=(
            "dist/${PACKAGE}.zip"
            "dist/${PACKAGE}.tar.gz"
            "dist/${PACKAGE}-full.zip"
            "dist/${PACKAGE}-full.tar.gz"
            "dist/fonts.zip"
            "dist/fonts.tar.gz"
            "dist/wanxiang-lts-zh-hans_gram.zip"
            "dist/wanxiang-lts-zh-hans_gram.tar.gz"
            "dist/sentence-ngram-mobile_bin.zip"
            "dist/sentence-ngram-mobile_bin.tar.gz"
            "dist/huma-font.zip"
            "dist/pingfangmod-font.zip"
            "dist/t26_pure-theme.zip"
            "dist/dvorak_pure-theme.zip"
          )
          for file in "${FILE_LIST[@]}"; do
            if [ -s "$file" ]; then
              echo "✅ Valid: $file"
              ls -lh "$file"
            else
              echo "❌ Invalid: $file"
              exit 1
            fi
          done

      # ✅ 只生成 feat & fix 的变更日志（干净版）
      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # 生成变更日志内容
          CONTENTS=$(git log --pretty="- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD 2>/dev/null | grep -E "^- (feat|fix|perf|feat\(|fix\(|perf\()" || true)

          # 使用 sed 替换模板中的占位符（使用 | 作为分隔符避免 URL 中的斜杠冲突）
          sed -e "s|{TAG}|$TAG|g" \
              -e "s|{REPO}|$REPO|g" \
              -e "/{CONTENTS}/r /dev/stdin" \
              -e "/{CONTENTS}/d" \
              .github/release-template.txt <<< "$CONTENTS" > release_notes.txt

          # 设置输出变量
          {
            echo "notes<<EOF"
            cat release_notes.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

          # 清理临时文件
          rm release_notes.txt

      # ✅ 创建 Release（使用上面生成的变更日志）
      - name: Create Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
