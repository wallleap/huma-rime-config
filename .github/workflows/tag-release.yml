name: Build Full Repository and Release on Tag Push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 显示目录结构
      - name: Show directory structure
        run: |
          pwd
          ls -lh

      # 下载 wanxiang-lts-zh-hans.gram 语法文件
      - name: Download wanxiang grammar file
        run: |
          curl -L -o ./wanxiang-lts-zh-hans.gram \
          https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram

      # 重命名示例文件
      - name: Rename custom_phrase.example.txt to custom_phrase.txt
        run: |
          if [ -f "custom_phrase.example.txt" ]; then
            mv custom_phrase.example.txt custom_phrase.txt
            echo "✅ Renamed successfully"
          else
            echo "ℹ️ No example file found, skip"
          fi

      # 定义统一变量（全局可用）
      - name: Set build variables
        id: vars
        run: |
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "PACKAGE=huma-config-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "FOLDER=huma_rime_config" >> $GITHUB_OUTPUT

      # 打包：创建目录 + 移动文件（支持排除）+ 打包 tar.gz + zip
      - name: Package into folder + create tar.gz + zip
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          FOLDER=${{ steps.vars.outputs.FOLDER }}
          mkdir -p dist
          mkdir -p "$FOLDER"

          shopt -s extglob
          
          # ====================== 排除规则 ======================
          # 在这里添加你不想打包的文件/文件夹
          # 格式：｜ 文件1｜文件2｜目录/｜等等
          # =======================================================
          mv \
            !(dist|$FOLDER|.git|.github|.gitignore|.gitattributes|*.example.*|bin/|README.md|chagelog.txt|crawler.py|huma.recipe.yaml|wanxiang-lts-zh-hans.gram|flypy_phrase.txt|LICENSE) \
            "$FOLDER"/

          # 创建 flypy_phrase.txt 文件到目录下
          echo -e "Rime 输入法\trime\t100" > "$FOLDER"/flypy_phrase.txt

          # 打包 tar.gz
          tar -zcvf "dist/${PACKAGE}.tar.gz" "$FOLDER"

          # 打包 zip
          zip -r9 "dist/${PACKAGE}.zip" "$FOLDER"

          ls -lh dist/

      # 校验压缩包
      - name: Validate packages
        run: |
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          for file in "dist/${PACKAGE}.tar.gz" "dist/${PACKAGE}.zip"; do
            if [ -s "$file" ]; then
              echo "✅ Valid: $file"
              ls -lh "$file"
            else
              echo "❌ Invalid: $file"
              exit 1
            fi
          done

      # 创建 Release + 自动生成日志
      - name: Create Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
