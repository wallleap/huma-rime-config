name: Build Full Repository and Release on Tag Push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 显示目录结构
      - name: Show directory structure
        run: |
          pwd
          ls -lh

      # 重命名示例文件
      - name: Rename custom_phrase.example.txt to custom_phrase.txt
        run: |
          if [ -f "custom_phrase.example.txt" ]; then
            mv custom_phrase.example.txt custom_phrase.txt
            echo "✅ Renamed successfully"
          else
            echo "ℹ️ No example file found, skip"
          fi

      # 定义统一变量（全局可用）
      - name: Set build variables
        id: vars
        run: |
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "PACKAGE=huma-config-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "FOLDER=huma_rime_config" >> $GITHUB_OUTPUT

      # 1. 创建目录 + 移动所有文件到 huma_rime_config 文件夹
      # 2. 同时打包成 tar.gz 和 zip 两种格式
      - name: Package into folder + create tar.gz + zip
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          FOLDER=${{ steps.vars.outputs.FOLDER }}
          mkdir -p dist
          mkdir -p "$FOLDER"

          # 移动所有文件到打包目录（排除需要忽略的 + 排除自身目录）
          shopt -s extglob
          mv !(dist|$FOLDER) "$FOLDER"/

          # 打包 tar.gz
          tar -zcvf "dist/${PACKAGE}.tar.gz" "$FOLDER"

          # 打包 zip（Ubuntu 自带 zip 工具）
          zip -r9 "dist/${PACKAGE}.zip" "$FOLDER"

          ls -lh dist/

      # 校验压缩包是否有效（防止空包）
      - name: Validate packages
        run: |
          PACKAGE=${{ steps.vars.outputs.PACKAGE }}
          for file in "dist/${PACKAGE}.tar.gz" "dist/${PACKAGE}.zip"; do
            if [ -s "$file" ]; then
              echo "✅ Valid: $file"
              ls -lh "$file"
            else
              echo "❌ Invalid: $file"
              exit 1
            fi
          done

      # 创建 Release + 上传两个压缩包 + 自动生成更新日志
      - name: Create Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
