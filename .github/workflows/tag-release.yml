name: Build Full Repository and Release on Tag Push

on:
  push:
    tags:
      - '*'

# 核心：显式声明工作流所需权限，解决 403 错误
permissions:
  contents: write # 关键权限：允许创建/修改 Release、上传资产（contents: write 是核心）
  pull-requests: read # 可选：读取 PR 信息，不影响 Release 核心操作

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出仓库代码
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤 2：验证仓库文件存在
      - name: Verify repository files exist
        run: |
          echo "当前工作目录：$(pwd)"
          ls -lh

      # 步骤 3：新增 - 重命名 custom_phrase.example.txt 为 custom_phrase.txt
      - name: Rename custom_phrase.example.txt to custom_phrase.txt
        run: |
          # 容错处理：先检查文件是否存在，存在再重命名，避免文件不存在导致报错
          if [ -f "custom_phrase.example.txt" ]; then
            mv custom_phrase.example.txt custom_phrase.txt
            echo "Successfully renamed: custom_phrase.example.txt -> custom_phrase.txt"
            # 验证重命名结果
            ls -lh custom_phrase.txt
          else
            echo "Warning: custom_phrase.example.txt not found, skip renaming"
          fi

      # 步骤 4：压缩整个仓库（输出到临时目录，避免文件变化）
      - name: Compress files into Rime directory (tar directly)
        run: |
          TAG_NAME=${{ github.ref_name }}
          ARTIFACT_NAME="Rime-config-${TAG_NAME}"
          TAR_FILE="/tmp/${ARTIFACT_NAME}.tar.gz"
          
          # 直接用 tar --transform 重命名，打包时自动创建 Rime 目录
          tar -zcvf ${TAR_FILE} \
            --exclude=".git" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude=".github" \
            --exclude="plum" \
            --transform='s/^./Rime/' \
            .

          echo "Created tar.gz file at: ${TAR_FILE}"
        
          cp ${TAR_FILE} ./
          ls -lh ./${ARTIFACT_NAME}.tar.gz

      # 步骤 5：创建 Release 并上传压缩包
      - name: Create Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
