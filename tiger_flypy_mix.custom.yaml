# Rime schema patch
# encoding: utf-8

patch:
  engine/translators/+:
    - lua_translator@*input_statistics # 统计不同方案不同维度下输入信息

  recognizer/patterns/stats: "^tj(rt|zt|yt|nt|qk)$" # 统计输入信息识别模式

  # 语言模型
  "grammar/language": wanxiang-lts-zh-hans
  "grammar/collocation_max_length": 5
  "grammar/collocation_min_length": 2

  # lua 配置：在用户词典中
  in_user_dict:
    user_phrase_symbol: "✴️"
    user_table_symbol: "✨"
    sentence_symbol: "♾️"
