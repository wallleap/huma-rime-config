patch:
  # 全局字体设置
  "style/candidate_font": LXGWWenKaiGBScreen.ttf
  "style/comment_font": LXGWWenKaiGBScreen.ttf
  "style/candidate_font_size": 16
  "style/comment_font_size": 12
  "style/key_font": LXGWWenKaiGBScreen.ttf
  "style/key_font_size": 14

  # 键盘布局微调
  "style/vertical_gap": 2
  "style/horizontal_gap": 16
  "style/keyboard_padding": 4
  "style/keyboard_padding_bottom": 4

  # 注释提示文字位置调整
  "style/comment_on_top": false

  # 自定义配色方案
  "preset_color_schemes/a_yellow_gradient":
    name: 暖黄渐变 / Yellow Gradient
    author: vonnelu
    # 核心背景与边框
    back_color: 0xfffffbf5
    border_color: 0xfff0e8d0
    # keyboard_back_color: 0xfffff7e8
    keyboard_back_color: keyboard-light.png
    shadow_color: 0x20ffe0b0
    # 候选区相关
    candidate_separator_color: 0xfff0e8d0
    candidate_text_color: 0xff333333
    hilited_candidate_back_color: 0xfffdd866
    hilited_candidate_text_color: 0xff333333
    # 提示文字相关
    comment_text_color: 0xff999999
    hilited_comment_text_color: 0xff333333
    # 编码区相关
    text_color: 0xff333333
    text_back_color: 0xfffffbf5
    hilited_text_color: 0xff333333
    hilited_back_color: 0xfffdd866
    # 按键基础样式
    key_back_color: 0x7fffffff
    key_border_color: 0xfff0e8d0
    key_text_color: 0xff333333
    key_symbol_color: 0xff999999
    # 按键高亮（选中/激活）
    hilited_key_back_color: 0xfffdd866
    hilited_key_text_color: 0xff333333
    hilited_key_symbol_color: 0xff333333
    # 开关按键样式
    off_key_back_color: 0xfffdd866
    off_key_text_color: 0xff333333
    hilited_off_key_back_color: 0xfffdd866
    hilited_off_key_text_color: 0xff333333
    on_key_back_color: 0xfffdd866
    on_key_text_color: 0xff333333
    hilited_on_key_back_color: 0xfffdd866
    hilited_on_key_text_color: 0xff333333
    # 其他细节
    label_color: 0xff333333
    preview_back_color: 0x55fdd866
    preview_text_color: 0xff333333
    # 额外按键精细化配置
    bkg: 0xffffffff
    tkg: 0xff333333
    benter: 0xfffdd866
    tenter: 0xff333333
    bgn: 0xfff0e8d0
    tgn: 0xff333333
    bbs: 0xfffdd866
    tbs: 0xff333333
    baoe: 0xffffffff
    taoe: 0xff333333
    bh1: 0x7fffffff
    th1: 0xff333333
    bh2: 0x7fffffff
    th2: 0xff333333
    bh3: 0x7fffffff
    th3: 0xff333333
    bh4: 0x7fffffff
    th4: 0xff333333
  "preset_color_schemes/a_dark_brown_tone":
    name: 深棕暗调 / Dark Brown Tone
    author: vonnelu
    # 核心背景与边框
    back_color: 0xff2d231d
    border_color: 0xff4a3c32
    # keyboard_back_color: 0xff3a2e26
    keyboard_back_color: keyboard-dark.png
    shadow_color: 0x30000000
    # 候选区相关
    candidate_separator_color: 0xff4a3c32
    candidate_text_color: 0xffffffff
    hilited_candidate_back_color: 0xff995a3e
    hilited_candidate_text_color: 0xffffffff
    # 提示文字相关
    comment_text_color: 0xffcccccc
    hilited_comment_text_color: 0xffffffff
    # 编码区相关
    text_color: 0xffffffff
    text_back_color: 0xff2d231d
    hilited_text_color: 0xffffffff
    hilited_back_color: 0xff995a3e
    # 按键基础样式
    key_back_color: 0x7f4a3c32
    key_border_color: 0xff5a483c
    key_text_color: 0xffffffff
    key_symbol_color: 0xffcccccc
    # 按键高亮（选中/激活）
    hilited_key_back_color: 0xff995a3e
    hilited_key_text_color: 0xffffffff
    hilited_key_symbol_color: 0xffffffff
    # 开关按键样式
    off_key_back_color: 0xff995a3e
    off_key_text_color: 0xffffffff
    hilited_off_key_back_color: 0xff995a3e
    hilited_off_key_text_color: 0xffffffff
    on_key_back_color: 0xff995a3e
    on_key_text_color: 0xffffffff
    hilited_on_key_back_color: 0xff995a3e
    hilited_on_key_text_color: 0xffffffff
    # 其他细节
    label_color: 0xffffffff
    preview_back_color: 0x55995a3e
    preview_text_color: 0xffffffff
    # 额外按键精细化配置
    bkg: 0xff4a3c32
    tkg: 0xffffffff
    benter: 0xff995a3e
    tenter: 0xffffffff
    bgn: 0xff4a3c32
    tgn: 0xffffffff
    bbs: 0xff995a3e
    tbs: 0xffffffff
    baoe: 0xff4a3c32
    taoe: 0xffffffff
    bh1: 0x7f4a3c32
    th1: 0xffffffff
    bh2: 0x7f4a3c32
    th2: 0xffffffff
    bh3: 0x7f4a3c32
    th3: 0xffffffff
    bh4: 0x7f4a3c32
    th4: 0xffffffff

  # 设置默认使用该配色方案
  "style/color_scheme": a_dark_brown_tone
