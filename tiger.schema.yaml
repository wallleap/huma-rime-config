# Rime schema: tiger.schema.yaml 虎码单字
# encoding: utf-8
# Schema 配置：https://github.com/LEOYoon-Tsaw/Rime_collections/blob/master/Rime_description.md

# 方案描述信息
schema:
  author: # 作者
    - 虎码团队
  dependencies: # 依赖的方案
    - flypy # 小鹤双拼方案，用于反查
    - easy_english # 英文
  description: | # 简要描述
    虎码官方单字
    敲 ` 鍵進入拼音反查
  name: "虎码·单字" # 切换时显示的名称，一般为中文
  schema_id: tiger # 方案ID，一般为文件名，由小写字母、数字、下划线组成，需要唯一
  ascii_icon: "icons/en.ico" # 小狼毫输入状态图标
  full_icon: "icons/full.ico"
  half_icon: "icons/half.ico"
  # icon: "icons/tiger.ico"
  icon: "icons/tiger_zi.ico"
  version: "0.9" # 版本号，建议加引号，字符串格式

# 开关
switches: # 0 默认关，1 默认开
  # name / options（要和下面的搭配使用），states（开关状态），reset（默认值）
  - name: ascii_mode # 中英文状态
    reset: 0
    states: [中文, 西文]
  - name: extended_char # 自定义字集
    reset: 1
    states: [全字集, 常用字]
  - name: pinyin # 拼音滤镜
    reset: 1
    states: [拼, pīn]
  - name: emoji_cn # emoji滤镜
    reset: 0
    states: [🈚, 🈶]
  - name: chaifen
    reset: 1
    states: [拆隐, 拆显]
  # - options: [ gb2312, gbk, utf8 ]
  #   states: [ gb2312, GBK, UTF-8 ]
  #   reset: 0
  - name: simplification # 简转繁滤镜
    reset: 0
    states: [简中, 繁中]
  # - options: [_keyboard_default, _keyboard_defaultbk, _keyboard_defaultwk]
  #   reset: 0
  #   states: [有刻, 半刻, 无刻]
  - name: charset_comment_filter # 字符集提示
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]
  - name: ascii_punct # 中西文标点转换
    reset: 0
    states: [。，, ．，]
  # - name: dz_ci  # 过滤词组
  #   reset: 0
  #   states: [ 词组, 单字 ]
  # - options: [_keyboard_default, _keyboard_defaultzj]
  #   reset: 0
  #   states: [助记关, 助记开]
  # - name: fanjian  # 繁转简滤镜
  #   reset: 0
  #   states: [ 反繁, 反简 ]
  - name: full_shape # 半角符号／全角符号
    reset: 0
    states: [半角, 全角]

# 引擎设置，处理从输入到输出的过程
engine:
  processors: # 1. 处理各类按键消息（将按鍵所产生的字符记入上下文中的「输入码」序列）
    - key_binder # 在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、开关快捷键等（下面的同名配置项）
    - ascii_composer # 处理 ASCII 西文模式、中西文切换
    - recognizer # 与 matcher 搭配使用，处理符合特定规则的输入码，如网址、反查等
    - speller # 处理拼写，将字母键加入输入码序列
    - punctuator # 句读处理器，将单个字符按键直接映射为标点符号或文字
    - lua_processor@switcher_processor # mode 切换，使用 lua 自定义按键，后接@lua函数名，参数为(key, env)
    - selector # 选字处理器，处理选字操作，如候选词上屏、下屏、切换等
    - navigator # 处理输入栏内的光标移动，如左右方向键、Home、End 等
    - express_editor # 编辑器，处理空格、回车上屏、回退键
    # - fluid_editor # 句式编辑器，用于以空格断词、回车上屏的【注音】、【语句流】等输入方案，替换express_editor
    # - chord_composer # 和絃作曲家或曰并击处理器，用于【宫保拼音】等多键并击的输入方案
  segmentors: # 2. 分段器，识别不同内容类型，将输入码分段并加上 tag（分段并打标签）
    - ascii_segmentor # 标识西文段落〔譬如在西文模式下〕字母直接上屛
    - matcher # 配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
    - affix_segmentor@easy_english # 用户自定义 tag，此项可加载多个实例，后接 @tag名。英文相关
    - abc_segmentor # 标识常规的文字段落，加上 abc 这个 tag
    - punct_segmentor # 标识句读段落〔键入标点符号用〕加上 punct 这个 tag
    - fallback_segmentor # 标识其他未标识段落
    # - lua_segmentor # 使用 lua 自定义切分，后接 @lua函数名
  translators: # 3. 翻译特定类型的编码段为一组候选文字（完成由编码到文字的翻译）
    # - echo_translator # 没有其他候选字时，回显输入码〔输入码可以 Shift + Enter 上屛〕
    - punct_translator # 配合 punct_segmentor 转换标点符号
    # - script_translator # 脚本翻译器，用于拼音、粤拼等基于音节表的输入方案，后可接 @翻译器名
    # - reverse_lookup_translator # 反查翻译器，用另一种编码方案查码
    - reverse_lookup_translator@flypy_reverse_lookup
    - table_translator # 码表翻译器，用于仓颉、五笔等基于码表的输入方案，后接 @翻译器名
    - table_translator@easy_english # 临时英文
    - history_translator@historyDM # 重复上屏 电脑
    - history_translator@historyDM2 # 重复上屏 电脑2
    - history_translator@historyDM3 # 重复上屏 电脑3
    - history_translator@historySJ # 重复上屏 手机
    # lua_translator 使用 lua 自定义输入，例如动态输入当前日期、时间，后接 @lua函数名
    # lua 函数名即用户文件夹内 rime.lua 中函数名，参数为 (input, seg, env)，@*函数名 可以直接调用 lua 目录下对应函数
    # 可以 env.engine.context:get_option("option_name") 方式绑定到 switch开关／key_binder快捷键
    - lua_translator@number_translator # 数字转大写
    - lua_translator@calculator_translator # 简易计算器
    - lua_translator@switcher_translator # mode 切换方案
    - lua_translator@*helper # 帮助
    - lua_translator@*uuid_translator # 生成 uuid
    - lua_translator@*date_translator # 动态日期时间输入
    - lua_translator@*input_statistics # 统计不同方案不同维度下输入信息
  filters: # 4. 过滤翻译的结果
    # lua_filter 自定义字集过滤 lua，例如过滤字符集、调整排序，后接 @lua函数名
    # lua函数名即用户文件夹内 rime.lua 中函数名，参数为 (input, env)
    - lua_filter@core2022 # 放在最上面完美解决简繁滤镜出错的问题
    # - lua_filter@dz_ci # 过滤词组lua，单字模式
    # - charset_filter@utf8 # 字符集过滤，@字符集名〔如：utf-8(无过滤)、big5、big5hkscs、gbk、gb2312〕
    # - charset_filter@gbk
    # - charset_filter@gb2312
    # - simplifier # 繁简转换
    - simplifier@simplification # 用字转换，简繁滤镜
    # - simplifier@fanjian # 繁简滤镜
    # - simplifier@pinyin # 拼音滤镜
    - lua_filter@pinyin_comment_filter # 拼音滤镜(Lua追加模式)
    # - simplifier@chaifen # 拆分滤镜
    - simplifier@emoji_cn # 表情滤镜
    - lua_filter@switcher_filter
    - lua_filter@chaifen_comment_filter # 拆分滤镜(Lua追加模式)
    # - reverse_lookup_filter@reverse_lookup # 反查滤镜，以更灵活的方式反查，Rime1.0 后替代 reverse_lookup_translator，后接 @滤镜名
    - lua_filter@charset_comment_filter # Unicode分区提示滤镜
    - lua_filter@lua_unicode_display_filter # Unicode编码显示
    - uniquifier # 过滤重复的候选字，有可能来自 simplifier

##################### 下方配置格式 #####################
# name:
#   branches: configurations
# 或
# name:
#   branches:
#     - configurations
# comment_format、preedit_format、speller/algebra 所用之正则表达式，
# 查看 https://www.boost.org/doc/libs/1_49_0/libs/regex/doc/html/boost_regex/syntax/perl_syntax.html
######################################################

# 拼写器配置
speller:
  auto_clear: max_length # 3种选择， manual|auto|max_length 空码按下一键确认清屏|空码自动清|达到最长码时后码顶上清屏
  auto_select: true # 自动上屛〔true 或 false〕
  max_code_length: 4 # 形码最大码长，超过则顶字上屛〔number〕
  alphabet: "['zyxwvutsrqponmlkjihgfedcba]`/=S" # 定义本方案输入键 "[;'zyxwvutsrqponmlkjihgfedcba]`"
  # initials: "abcdefghijklmnopqrstuvwxyz;'" # 定义仅作始码之键
  # finals: "[a-z;']" # 定义仅作末码之键
  # delimiter: " '" # 上屛时的音节间分音符
  # algebra: | # 拼写运算规则，由之算出的拼写汇入 prism 中
  #   # 定义拼写运算规则，例如：
  #   xform/([nl])v/$1ü/ # 将 nv 转换为 ü
  #   xform/([nl])ue/$1üe/ # 将 nue 转换为 üe
  #   xform/([jqxy])v/$1u/ # 将 jv, qv, xv, yv 转换为 u
  auto_select_pattern: ^;\w+|^\w{4}$ # 四码自动上屏 ^;\w+ 对 [;] 引导的编码实行候选唯一自动上屏
  # use_space: false # 以空格作输入码〔true或false〕
######### speller 的演算包含：#######
# https://github.com/rime/home/wiki/SpellingAlgebra
# xform --改写〔不保留原形〕
# derive --衍生〔保留原形〕
# abbrev --简拼〔出字优先级较上两组更低〕
# fuzz --畧拼〔此种简拼仅组词，不出单字〕
# xlit --变换〔适合大量一对一变换〕
# erase --删除

# segmentor 配合 recognizer 标记出 tag
# 拼音反查
flypy_reverse_lookup:
  dictionary: flypy
  prefix: "`" # 设置其前缀标识
  tips: "〔小鹤双拼〕" # 设置其输入前提示符
  preedit_format:
    - "xform/^`//"
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  comment_format:
    - "xform/^/【/"
    - "xform/$/】/"
  # suffix: "'" # 设置其尾缀标识
  # closing_tips: "〔反查〕" # 设置其结束输入提示符
  tag: flypy_lookup # 标记出 tag，用于识别反查用在 translator、reverse_lookup_filter、simplifier 中用以标定各自作用范围
  extra_tags: [reverse_lookup] # 为此 segmentor 所标记的段落插上其它 tag
  overwrite_comment: false

# 每个方案有一个主 translator
translator:
  dictionary: tiger.extended # 翻译器将调取此字典文件
  enable_charset_filter: false # 是否开启字符集过滤〔仅 table_translator有效。启用 cjk_minifier 后可适用于 script_translator〕
  enable_encoder: false # 是否开启自动造词〔仅 table_translator 有效〕
  encode_commit_history: false # 是否对已上屛词自动成词〔仅 table_translator 有效〕
  # max_phrase_length: 4 # 最大自动成词词长〔仅 table_translator 有效〕
  enable_completion: false # 编码提示，默认关闭，提前显示尚未输入完整码的字〔仅 table_translator 有效〕
  # sentence_over_completion: false # 在无全码对应字而仅有逐键提示时也开启智能组句〔仅 table_translator 有效〕
  # strict_spelling: false # 配合 speller 中的 fuzz 规则，仅以畧拼码组词〔仅 table_translator 有效〕
  # disable_user_dict_for_patterns: false # 禁止某些编码录入用户词典
  enable_sentence: false # 是否开启自动造句
  enable_user_dict: false # 是否开启用户词典〔用户词典记录动态字词频、用户词〕
  # prism: tiger # 设置由此主翻译器的 speller 生成的棱镜文件名，或此副编译器调用的棱镜名
  # user_dict: tiger # 设置用户词典名
  # db_class: table # 设置用户词典类型，可设tabledb〔文本〕或userdb〔二进制〕
  # preedit_format: 上屛码自定义
  comment_format: # 提示码自定义
    - "xform/~/ /" # 去掉编码提示前的~号
    # - "xform/^/ /" #提示前面 +间距
  # spelling_hints: 3 # 设置多少字以内候选标注完整带调拼音〔仅 script_translator 有效〕
  # initial_quality: 0.75 # 设置此翻译器出字优先级
  ###### 下面的可以在副翻译器 @翻译器名 中定义
  # tag: tiger # 设置此翻译器针对的 tag。可不塡，不塡则仅针对 abc
  # prefix: # 设置此翻译器的前缀标识，可不塡，不塡则无前缀
  # suffix: # 设置此翻译器的尾缀标识，可不塡，不塡则无尾缀
  # tips: # 设置此翻译器的输入前提示符，可不塡，不塡则无提示符
  # closing_tips: # 设置此翻译器的结束输入提示符，可不塡，不塡则无提示符
  # contextual_suggestions: # 是否使用语言模型优化输出结果〔需配合 grammar 使用〕
  # max_homophones: # 最大同音簇长度〔需配合 grammar 使用〕
  # max_homographs: # 最大同形簇长度〔需配合 grammar 使用〕

# 临时英文
easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: 〔En〕
  enable_completion: true
  enable_sentence: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format: # 去掉编码提示前的~号
    - "xform/~/ /"

historySJ:
  input: "z"
  size: 1
  initial_quality: 0

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

# ↓简繁(+部分异体)滤镜
simplification: #⇩四选一
  opencc_config: st_tu.json # 用字转换配置文件，在 opencc 下。简 ➡ 繁·异（秃版标准）
  # 自带文件：t2s.json（繁转简）、t2tw.json（繁转台湾正体）、s2hk.json（简转香港繁体）、s2t.json（简转繁）
  # opencc_config: s2tw.json # 简 ➡ 台湾正体
  # opencc_config: s2hk.json # 简 ➡ 香港繁体
  # opencc_config: s2twp.json # 简 ➡ 台湾正体（含常用词汇如：软体→軟體、鼠标→滑鼠）
  option_name: simplification # 对应 switches 中设置的切换项名
  tips: all # 设置是否提示转换前的字，可塡none〔或不塡〕、char〔仅对单字有效〕、all
  # tags: [simplification] # 设置转换范围，这里仅对 simplification 生效
  # show_in_comment: true # 设置是否仅将转换结果显示在备注中，而不是在输入框中
  # excluded_types: 取消特定范围〔一般为 reverse_lookup_translator〕转化用字〔如：反查〕

# ↓繁简滤镜
# fanjian:
#   opencc_config: t2s.json   # 繁 ➡ 简（OpenCC标准）
#   option_name: fanjian

# ↓拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true # 作为注解在后面显示
  comment_format:
    - "xform/&nbsp;/ /"
    # 去除拼音滤镜的括号，如对括号有需求，可在下面5行前面加上#号注释掉
    # - 'xform/&nbsp;/ /'
    # - 'xform/^/ /'
    # - 'xform/（//'
    # - 'xform/）//'
    # 也可自己把 （ 替换成别的，比如 'xform/（/〔/'
  tips: char
  tags:
    - abc
    - tiger
    - tigress
    # - reverse_lookup

# ↓emoji表情滤镜
emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

# 拆分滤镜
chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tags:
    - abc
    - tiger
    - tigress
    - reverse_lookup
  tips: all # 如只想给单字加滤镜，可改为 char

# 并击把键盘分两半，相当于两块键盘。两边同时击键，系统默认在其中一半上按的键先于另一半，由此得出上屛码
# chord_composer

# 识别器，用于识别输入的字符，将其转换为对应的码点
recognizer:
  import_preset: default
  patterns: # 配合 segmentor 的 prefix 和 suffix 完成段落划分、tag分配
    # 以 affix_segmentor@someTag 定义的 Tag名
    # 或者 punct、reverse_lookup 两个内设的字段。其它字段不调用输入法引擎，输入即输出〔如 url 等字段〕
    punct: "^/([0-9]0?|[A-Za-z]+)$" # "^/[A-Za-z0-9_]*$"
    # uppercase: "" #中文状态大写锁定直接上屏
    reverse_lookup: "^`[a-z]*'?$"
    flypy_lookup: "^`[a-z]*'?$"
    easy_english: "^'[A-Z|a-z]*`?$"
    expression: "^=.*$"
    number: "^S[0-9]*$"
    stats: "^tj(rt|zt|yt|nt|qk)$" # 统计输入信息识别模式
    help: "^help$" # 帮助输入信息识别模式

# 标点符号，用于将输入的标点符号转换为对应的码点
punctuator:
  # 下设 full_shape:和 half_shape:分别控制全角模式下的符号和半角模式下的符号，每条标点项可加 commit直接上屏和 pair交替上屏两种模式，默认为选单模式
  # 另有 use_space:空格顶字〔true 或 false〕
  import_preset: symbols # default 导入预设的，设置其他则会读取 xxx.yaml 中定义的符号表

# 按键绑定器，用于将输入的按键转换为对应的码点
key_binder:
  # import_preset: default
  # 用以订制操作键〔不支持 import_preset:〕，键板键名同 key_binder/bindings 中的 accept 和 send 编辑器，用于配置输入框的行为
  # editor:
  #   { when: always, accept: "Space", send: confirm }
  # confirm 上屏候选项、commit_comment 上屏候选项备注、commit_raw_input 上屏原始输入、commit_script_text 上屏变换后输入、commit_composition 语句流单字上屏、revert 撤消上次输入、back 按字符回退、back_syllable 按音节回退、delete_candidate 删除候选项、delete 向后删除、cancel 取消输入、noop 空
  bindings: # 设置功能性快捷键
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/select_candidate
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/paging_with_brackets
      - key_bindings:/windows_compatible_mode_switch
      - key_bindings:/tiger_pc_options
      # - key_bindings:/tiger_mobile_options

__patch:
  "style/horizontal": false
  "style/candidate_list_layout": stack

  "style/comment_font_face": "Consolas, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, PingFang SC, STHeiti, Microsoft YaHei, SimHei, TH-Times, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16, TumanPUA, SimSun, 宋体, 新宋体, SimSun-ExtB, SimSun-ExtG, LXGW WenKai GB Screen, CJK-extJ"
