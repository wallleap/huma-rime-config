  # lua 配置：在用户词典中
  in_user_dict:
    user_phrase_symbol: "✴️"
    user_table_symbol: "✨"
    sentence_symbol: "♾️"

  "style/horizontal": true
  "style/candidate_list_layout": linear

  keybinder/+:
    aux_code_learn_trigger: ";"
    aux_code_no_learn_trigger: ";;"
    show_aux_notice: true
