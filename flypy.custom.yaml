patch:
  schema/ascii_icon: "icons/en.ico"
  schema/full_icon: "icons/full.ico"
  schema/half_icon: "icons/half.ico"
  schema/icon: "icons/shuang.ico"

  engine/processors/@before 0: lua_processor@switcher_processor

  # 这样写确保 uniquifier 在最后
  'engine/filters/@before 0': lua_filter@switcher_filter # 切换方案
  'engine/filters/@before 1': lua_filter@*in_user_dict # 在用户词典中
  'engine/filters/@before last': lua_filter@*aux_code@flypy_full # 辅码码表

  engine/translators:
    - punct_translator # 转换标点符号
    - script_translator # 脚本表转换
    - lua_translator@switcher_translator # 切换方案
    - table_translator@custom_phrase
    - table_translator
    - table_translator@easy_english # 临时英文
    - reverse_lookup_translator # 反查翻译器
    - history_translator@historyDM # 历史上屏 电脑
    - history_translator@historyDM2 # 历史上屏 电脑2
    - history_translator@historyDM3 # 历史上屏 电脑3
    - history_translator@historySJ # 历史上屏 手机
    - lua_translator@number_translator # 数字转大写
    - lua_translator@calculator_translator # 简易计算器
    - lua_translator@*helper # 帮助
    - lua_translator@*uuid_translator # UUID 输入
    - lua_translator@*date_translator # 动态日期时间输入
    - lua_translator@*input_statistics # 统计不同方案不同维度下输入信息

  recognizer/patterns/stats: "^tj(rt|zt|yt|nt|qk)$" # 统计输入信息识别模式

  punctuator/half_shape:
    "/": "/"
    "\\": "、"
    ";": { commit: "；" }
    "<": "《"
    ">": "》"

  speller/alphabet: "['zyxwvutsrqponmlkjihgfedcba;]/" # ;辅助码分割

  # 语言模型
  "grammar/language": wanxiang-lts-zh-hans
  "grammar/collocation_min_length": 2
  "grammar/collocation_max_length": 5

  # 上下文建议
  translator/contextual_suggestions: true
  translator/max_homophones: 7 # 最大同音字数
  translator/max_homographs: 7 # 最大同形字数

  # 上屏码自定义
  # translator/preedit_format:
  #   - xform/([bpmfdtnljqx])n/$1iao/
  #   - xform/(\w)g/$1eng/
  #   - xform/(\w)q/$1iu/
  #   - xform/(\w)w/$1ei/
  #   - xform/([dtnlgkhjqxyvuirzcs])r/$1uan/
  #   - xform/(\w)t/$1ve/
  #   - xform/(\w)y/$1un/
  #   - xform/([dtnlgkhvuirzcs])o/$1uo/
  #   - xform/(\w)p/$1ie/
  #   - xform/([jqx])s/$1iong/
  #   - xform/(\w)s/$1ong/
  #   - xform/(\w)d/$1ai/
  #   - xform/(\w)f/$1en/
  #   - xform/(\w)h/$1ang/
  #   - xform/(\w)j/$1an/
  #   - xform/([gkhvuirzcs])k/$1uai/
  #   - xform/(\w)k/$1ing/
  #   - xform/([jqxnl])l/$1iang/
