# Rime schema patch: tiger.custom.yaml 虎码单字补丁
# encoding: utf-8
# Schema 配置：https://github.com/LEOYoon-Tsaw/Rime_collections/blob/master/Rime_description.md

patch:
  schema/name: 虎单

  # translator/dictionary: tiger.extended #引入增补自定词典，这个不要改动
  # translator/enable_completion: true # 编码提示，默认关闭，删掉行首的#号，即可开启
  speller/auto_select_pattern: ^;\w+|^\w{4}$ # 四码上屏功能，删掉行首的#号，即可开启
  # speller/alphabet: "['zyxwvutsrqponmlkjihgfedcba]" # 取消分号引导的快符功能（分号不作码元），删掉行首#号即可生效
  # style/mark_text: " " #编号前标志，这里是空格，可在引号里可以自己加东西替换，如 "😅"
  # style/layout/border_width: 2 #边框宽度，默认是0
  # style/layout/border_height: 2 #边框高度，默认是0

  engine/segmentors/+:
    - affix_segmentor@flypy_reverse_lookup

  engine/processors/@before 0: lua_processor@switcher_processor

  engine/filters:
    - lua_filter@core2022 #自定义字集过滤lua；放在最上面完美解决简繁滤镜出错的问题
    # - lua_filter@dz_ci  #过滤词组lua，单字模式
    # - charset_filter@utf8
    # - charset_filter@gbk
    # - charset_filter@gb2312
    - simplifier@simplification #简繁滤镜
    # - reverse_lookup_filter@reverse_lookup #反查词典滤镜
    # - simplifier@fanjian #繁简滤镜
    # - simplifier@pinyin #拼音滤镜（放弃这种，会覆盖备注）
    - lua_filter@pinyin_comment_filter #拼音滤镜(Lua追加模式)
    - simplifier@emoji_cn #表情滤镜
    - lua_filter@chaifen_comment_filter
    - lua_filter@switcher_filter
    - lua_filter@charset_comment_filter #Unicode分区提示滤镜
    - lua_filter@lua_unicode_display_filter #Unicode编码显示
    - uniquifier #过滤重复

  engine/translators/+:
    - reverse_lookup_translator@flypy_reverse_lookup
    - lua_translator@switcher_translator
    - lua_translator@*helper # 帮助
    - lua_translator@*uuid_translator
    - lua_translator@*date_translator # 动态日期时间输入
    - lua_translator@*input_statistics # 统计不同方案不同维度下输入信息

  recognizer/patterns/stats: "^tj(rt|zt|yt|nt|qk)$" # 统计输入信息识别模式

  punctuator/half_shape:
    "/": "/"
    "\\": "、"
    ";": { commit: "；" }
    "<": "《"
    ">": "》"

  # 反查
  flypy_reverse_lookup:
    tag: flypy_lookup
    dictionary: PY_c
    prefix: "`"
    tips: 〔小鹤双拼〕
  reverse_lookup:
    tags: [flypy_lookup]
    overwrite_comment: true
  # reverse_lookup/prefix: "`"
  # reverse_lookup/tips: "〔双拼〕"
  # reverse_lookup/preedit_format:
  #   - "xform/^`//"
  #   - "xform/([nl])v/$1ü/"
  #   - "xform/([nl])ue/$1üe/"
  #   - "xform/([jqxy])v/$1u/"
  # recognizer/patterns/reverse_lookup: "^`[a-z]*'?$"
  recognizer/patterns/flypy_lookup: "^`[a-z]*'?$"
  recognizer/patterns/punct: "^/[A-Za-z0-9_]*$"
  speller/alphabet: "['zyxwvutsrqponmlkjihgfedcba]`"

  menu/page_size: 9 # 自定义候选个数，可修改。若要改成5个，行首加上#号注释即可（Rime默认就是5个）
  # style/horizontal: true # 默认是false竖排显示，删掉行首的#号，可横排显示（横排建议把上面这行注释掉）
  # style/layout/candidate_spacing: 17 #候选框改为横排后,增加 候选与候选 的间距
  # style/layout/hilite_spacing: 8 #候选框改为横排后,增加 标号与候选 的间距
  # style/layout/min_width: 85 #候选框改为横排后,增加最小宽度
  # style/layout/max_width: 1200 #候选框改为横排后，限制最大宽度，超长自动换行
  # 横排显示建议把下面这行也注释掉，换成阿拉伯数字标号
  # menu/alternative_select_labels: [ ㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈ ]  # 自定义候选序号显示符，可自定修改，如要显示阿拉伯数字，直接注释掉这行（在前面加#号）
  # 以下是备选样式（自行删除#号即可生效，只能生效一种）
  # menu/alternative_select_labels: [ ①,②,③,④,⑤,⑥,⑦,⑧,⑨,⑩ ]
  # menu/alternative_select_labels: [ ❶,❷,❸,❹,❺,❻,❼,❽,❾,❿ ]
  # menu/alternative_select_labels: [ ⓵,⓶,⓷,⓸,⓹,⓺,⓻,⓼,⓽,⓾ ]
  # menu/alternative_select_labels: [ ㊀,㊁,㊂,㊃,㊄,㊅,㊆,㊇,㊈,㊉ ]
  # menu/alternative_select_labels: [ ㈠,㈡,㈢,㈣,㈤,㈥,㈦,㈧,㈨,㈩ ]
  # menu/alternative_select_labels: [ 🀇,🀈,🀉,🀊,🀋,🀌,🀍,🀎,🀏,🀄 ]
  # menu/alternative_select_labels: [ Ⅰ,Ⅱ,Ⅲ,Ⅳ,Ⅴ,Ⅵ,Ⅶ,Ⅷ,Ⅸ,Ⅹ ]
  # menu/alternative_select_labels: [ ⅰ,ⅱ,ⅲ,ⅳ,ⅴ,ⅵ,ⅶ,ⅷ,ⅸ,ⅹ ]
  # menu/alternative_select_labels: [ Ⓐ,Ⓑ,Ⓒ,Ⓓ,Ⓔ,Ⓕ,Ⓖ,Ⓗ,Ⓘ,Ⓙ ]
  # menu/alternative_select_labels: [ ⓐ,ⓑ,ⓒ,ⓓ,ⓔ,ⓕ,ⓖ,ⓗ,ⓘ,ⓙ ]

  # style/preedit_type: preview # 嵌入首选项内容(字词)。有4个选项可设：input 嵌入输入码 | composition 嵌入编码 | preview 嵌入首选项 | preview_all 嵌入全部内容
  # style/layout/margin_y : -1 # 启用后可隐藏候选框(盲打)，建议配合上面的嵌入首选项，一起使用

  # style/inline_preedit: false # 嵌入编码模式，默认是true开启，若想关闭，取消注释即可（删除前面的#号）

  # 去掉圆角 新小狼毫（Win）
  # style/layout/corner_radius: 0 #候选圆角
  # style/layout/round_corner: 0 #高亮圆角

  # 竖排候选框超长时自动倒序
  # style/vertical_auto_reverse: false # 默认启用，若想关闭，将该行行首的#删掉

  "style/horizontal": false
  "style/candidate_list_layout": stack

  style/comment_font_face: "Consolas, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, PingFang SC, STHeiti, Microsoft YaHei, SimHei, TH-Times, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16, TumanPUA, SimSun, 宋体, 新宋体, SimSun-ExtB, SimSun-ExtG, LXGW WenKai GB Screen"
  style/font_face: "Consolas, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, PingFang SC, STHeiti, Microsoft YaHei, SimHei, TH-Times, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16, TumanPUA, SimSun, 宋体, 新宋体, SimSun-ExtB, SimSun-ExtG, LXGW WenKai GB Screen"
  style/label_font_face: "Consolas, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, PingFang SC, STHeiti, Microsoft YaHei, SimHei, TH-Times, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16, TumanPUA, SimSun, 宋体, 新宋体, SimSun-ExtB, SimSun-ExtG, LXGW WenKai GB Screen"

  schema/ascii_icon: "icons/en.ico"
  schema/full_icon: "icons/full.ico"
  schema/half_icon: "icons/half.ico"
  schema/icon: "icons/tiger.ico"

  # 去除拼音滤镜的括号，如对括号有需求，可在下面5行前面加上#号注释掉
  # pinyin/comment_format:
  #   - 'xform/&nbsp;/ /'
  #   - 'xform/^/ /'
  #   - 'xform/（//'
  #   - 'xform/）//'
  # 也可自己把 （ 替换成别的，比如 'xform/（/〔/'

  # 让【 】可以直接上屏（对应的重复上屏的功能也没了）
  # speller/alphabet: ";'zyxwvutsrqponmlkjihgfedcba"
