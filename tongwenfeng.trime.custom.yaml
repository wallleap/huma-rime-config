patch:
  # 全局字体设置
  "style/candidate_font": LXGWWenKaiGBScreen.ttf
  "style/comment_font": LXGWWenKaiGBScreen.ttf
  "style/candidate_font_size": 16
  "style/comment_font_size": 12
  "style/key_font": LXGWWenKaiGBScreen.ttf
  "style/key_font_size": 14

  "preset_color_schemes/light_yellow_gradient":
    name: A-浅暖黄渐变
    author: 还原图中配色
    # 核心背景与边框
    back_color: 0xfffffbf5
    border_color: 0xfff0e8d0
    # keyboard_back_color: 0xfffff7e8
    keyboard_back_color: keyboard-light.png
    shadow_color: 0x20ffe0b0
    # 候选区相关
