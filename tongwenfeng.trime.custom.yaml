    candidate_text_color: 0xff333333
    hilited_candidate_back_color: 0xfffdd866
    hilited_candidate_text_color: 0xff333333
    # 提示文字相关
    comment_text_color: 0xff999999
    hilited_comment_text_color: 0xff333333
    # 编码区相关
    text_color: 0xff333333
    text_back_color: 0xfffffbf5
    hilited_text_color: 0xff333333
    hilited_back_color: 0xfffdd866
    # 按键基础样式
    key_back_color: 0x55ffffff
    key_border_color: 0xfff0e8d0
    key_text_color: 0xff333333
    key_symbol_color: 0xff999999
    # 按键高亮（选中/激活）
    hilited_key_back_color: 0xfffdd866
    hilited_key_text_color: 0xff333333
    hilited_key_symbol_color: 0xff333333
    # 开关按键样式
    off_key_back_color: 0xfffdd866
    off_key_text_color: 0xff333333
    hilited_off_key_back_color: 0xfffdd866
    hilited_off_key_text_color: 0xff333333
    on_key_back_color: 0xfffdd866
    on_key_text_color: 0xff333333
    hilited_on_key_back_color: 0xfffdd866
    hilited_on_key_text_color: 0xff333333
    # 其他细节
    label_color: 0xff333333
    preview_back_color: 0x55fdd866
    preview_text_color: 0xff333333
    # 额外按键精细化配置
    bkg: 0x55ffffff
    tkg: 0xff333333
    benter: 0xfffdd866
    tenter: 0xff333333
    bgn: 0xfff0e8d0
    tgn: 0xff333333
    bbs: 0xfffdd866
    tbs: 0xff333333
    baoe: 0xffffffff
    taoe: 0xff333333
    bh1: 0x55ffffff
    th1: 0xff333333
    bh2: 0x55ffffff
    th2: 0xff333333
    bh3: 0x55ffffff
    th3: 0xff333333
    bh4: 0x55ffffff
    th4: 0xff333333
  "preset_color_schemes/dark_brown_tone":
    name: A-深棕暗调
    author: 还原图中配色
    # 核心背景与边框
    back_color: 0xff2d231d
    border_color: 0xff4a3c32
    # keyboard_back_color: 0xff3a2e26
    keyboard_back_color: keyboard-dark.png
    shadow_color: 0x30000000
    # 候选区相关
    candidate_separator_color: 0xff4a3c32
    candidate_text_color: 0xffffffff
    hilited_candidate_back_color: 0xff995a3e
    hilited_candidate_text_color: 0xffffffff
    # 提示文字相关
    comment_text_color: 0xffcccccc
    hilited_comment_text_color: 0xffffffff
    # 编码区相关
