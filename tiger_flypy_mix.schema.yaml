# Rime schema: tiger_flypy_mix.schema.yaml 虎码+小鹤双拼混输
# encoding: utf-8
# 混输方案：同时支持虎码单字和小鹤双拼输入

schema:
  author:
    - vonnelu
  dependencies:
    - core2022
    - PY_c
    - easy_english
  description: |
    虎码官方单字 + 小鹤双拼混输
    可直接输入虎码编码，也可直接输入小鹤双拼
  name: "虎鹤双拼混输"
  schema_id: tiger_flypy_mix
  version: "0.9"
  ascii_icon: "icons/en.ico"
  full_icon: "icons/full.ico"
  half_icon: "icons/half.ico"
  icon: "icons/mix.ico"

switches:
  - name: ascii_mode
    states: [中文, 西文]
  - name: extended_char
    reset: 1
    states: [全字集, 常用字]
  - name: pinyin
    states: [拼, pīn]
  - name: emoji_cn
    states: [🈚, 🈶]
  - name: chaifen
    reset: 1
    states: [拆隐, 拆显]
  - name: simplification
    reset: 0
    states: [简中, 繁中]
  - name: charset_comment_filter
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]
  - name: ascii_punct
    reset: 0
    states: [。，, ．，]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

engine:
  processors:
    - lua_processor@switcher_processor
    - key_binder
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - lua_processor@exe_processor
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@easy_english
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - table_translator@tiger
    - script_translator
    - table_translator@easy_english
    - history_translator@historyDM
    - history_translator@historyDM2
    - history_translator@historyDM3
    - history_translator@historySJ
    - table_translator@custom_phrase
    - reverse_lookup_translator # 反查翻译器
    - lua_translator@number_translator
    - lua_translator@calculator_translator
    - lua_translator@switcher_translator
    - lua_translator@*helper # 帮助
    - lua_translator@*uuid_translator # UUID 输入
    - lua_translator@*date_translator # 动态日期时间输入
  filters:
    - lua_filter@core2022
    - simplifier@simplification
    - lua_filter@pinyin_comment_filter
    - simplifier@emoji_cn
    - lua_filter@chaifen_comment_filter
    - lua_filter@charset_comment_filter
    - lua_filter@lua_unicode_display_filter
    - uniquifier
    - lua_filter@*in_user_dict # 在用户词典中
    - lua_filter@switcher_filter # 切换方案

speller:
  auto_clear: max_length
  alphabet: "zyxwvutsrqponmlkjihgfedcba;'"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 万象词库转换
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/
    - xform/ḿ/m/
    # 小鹤双拼转换规则
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Q/
    - xform/(.)ei$/$1W/
    - xform/uan$/R/
    - xform/[uv]e$/T/
    - xform/un$/Y/
    - xform/^sh/U/
    - xform/^ch/I/
    - xform/^zh/V/
    - xform/uo$/O/
    - xform/ie$/P/
    - xform/i?ong$/S/
    - xform/ing$|uai$/K/
    - xform/(.)ai$/$1D/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/[iu]ang$/L/
    - xform/(.)ang$/$1H/
    - xform/ian$/M/
    - xform/(.)an$/$1J/
    - xform/(.)ou$/$1Z/
    - xform/[iu]a$/X/
    - xform/iao$/N/
    - xform/(.)ao$/$1C/
    - xform/ui$/V/
    - xform/in$/B/
    - xlit/QWRTYUIOPSDFGHJKLZXCVBNM/qwrtyuiopsdfghjklzxcvbnm/

# 小鹤双拼主翻译器
translator:
  dictionary: flypy # 字典文件
  prism: flypy
  initial_quality: 0 # 该翻译器出字优先级别
  spelling_hints: 1
  enable_user_dict: true # 开启用户词典〔用户词典记录动态字词频、用户词〕
  enable_encoder: true # 开启自动造词
  strict_spelling: false
  enable_sentence: true # 是否开启自动造句
  enable_completion: true # 编码提示 true 开启  false 关闭
  encode_commit_history: true # 是否对已上屏的词自动造词
  max_phrase_length: 99 # 自动造词的最长字数
  contextual_suggestions: true # 开启上下文建议
  max_homophones: 7 # 最大候选数
  max_homographs: 7 # 最大同音字数
  user_dict: flypy # 在本地生成的用户词典名称
  db_class: userdb # 用户词典格式，tabledb（文本） 或 userdb （二进制）
  # disable_user_dict_for_patterns:
  # #  - "^z.*$"  # 这是原始默认设置
  #   - "^[a-y]{1,2}$"  # 2码及以下不使用自动调频、不自动造词
  preedit_format: # 上屏码自定义
    - xform/([nl])v/$1ü/ # 拼音状态下输入nv实际显示nü
    - xform/([nl])ue/$1üe/ # n或者l后面紧跟着输入ue显示üe
    - xform/([jqxy])v/$1u/ # j q x y 后面紧跟着输入v 实际显示u
  comment_format: #提示码自定义
    - "xform/~/ /" #去掉编码提示前的~号
    - "xform/^/ /"

# 虎码翻译器
tiger:
  dictionary: tiger.extended
  enable_charset_filter: false
  enable_encoder: false
  encode_commit_history: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 10
  comment_format:
    - "xform/~/ /"

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: "〔笔画〕"
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - "xform/^/ /"

easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: 〔En〕
  enable_completion: true
  enable_sentence: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format:
    - "xform/~/ /"

custom_phrase:
  dictionary: ""
  user_dict: flypy_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 100

historySJ:
  input: "z"
  size: 1
  initial_quality: 0

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

simplification:
  opencc_config: st_tu.json
  option_name: simplification
  tips: all

pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tips: char
  tags:
    - abc
    - tiger
    - tigress

emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

chaifen:
  opencc_config: hu_cf.json
  option_name: chaifen
  show_in_comment: true
  comment_format:
    - "xform/&nbsp;/ /"
  tags:
    - abc
    - tiger
    - tigress
    - reverse_lookup
  tips: all
  max_char_length: 3

recognizer:
  import_preset: default
  patterns:
    punct: "^/[A-Za-z0-9_]*$"
    reverse_lookup: "^`[a-z]*'?$"
    easy_english: "^'[A-Z|a-z]*`?$"
    expression: "^=.*$"

punctuator:
  import_preset: symbols

key_binder:
  bindings:
    - { accept: "Control+Shift+O", toggle: simplification, when: composing }
    - { accept: "Control+Shift+P", toggle: pinyin, when: composing }
    - { accept: "Control+Shift+I", toggle: emoji_cn, when: composing }
    - { accept: "Control+Shift+U", toggle: charset_comment_filter, when: composing }
    - { accept: "Control+Shift+Y", toggle: udpf_switch, when: composing }
    - { accept: "Control+Shift+H", toggle: extended_char, when: composing }
    - { accept: "Control+Shift+J", toggle: chaifen, when: composing }

menu:
  page_size: 9

style:
  horizontal: false
  candidate_list_layout: stack
  comment_font_face: "Consolas, Segoe UI Emoji, Noto Color Emoji, Apple Color Emoji, TumanPUA, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
  font_face: "Consolas, Segoe UI Emoji, Noto Color Emoji, Apple Color Emoji, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
  label_font_face: "LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
