  style:
    #capture_type: none
    #color_font: true
    comment_font_face: "Consolas, Apple Color Emoji, TumanPUA, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
    comment_font_point: 10                  # 候选注释大小
    #display_tray_icon: false
    font_face: "Consolas, Apple Color Emoji, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
    font_point: 16                          # 候选字词大小
    #fullscreen: false
    inline_preedit: true #鼠须管开嵌入在QQ上可能会有点问题，这里可改为 true 关闭嵌入模式
    label_font_face: "LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
    label_font_point: 12                    # 候选编号大小
    #label_format: "%s."
    layout:
      min_width: 85
    corner_radius: 5
    hilited_corner_radius: 5
    line_spacing: 8
    hilite_spacing: 6
    spacing: 12
    # 鼠须管盲打，嵌入首选，删除下面两行的#号，即可生效
    #alpha: 0.0001
    #inline_candidate: true
    translucency: true                      # 毛玻璃总开关：true 开启，false 关闭
    alpha: 0.95                             # 透明度
    # mutual_exclusion: true                  # 候选区各颜色是否独立
    horizontal: false                       # 水平排列
    # 候选词格式 [label] 编号, [candidate] 候选词, [comment] 注释
    # candidate_format: "\u2005%c.\u2005%@\u2005" # 编号 %c 和候选词 %@ 前后的空间
    candidate_format: '[label]. [candidate] [comment]'
    candidate_list_layout: stack            # 候选词列表布局：stack 堆叠，linear 平铺
    text_orientation: horizontal            # 文本方向：horizontal 水平，vertical 垂直
    # inline_preedit: true                    # 行内编辑：true 在文本框中显示预编码，false 在预编辑区显示编码
    # inline_candidate: true                  # 行内显示第一候选：true 显示，false 不显示，和上面的 inline_preedit 搭配使用
    # memorize_size: true                     # 让候选框不来回跳动
    base_offset: 0                          # 文字基线高度调节
    border_height: 0                        # 外框边框高度，大于圆角半径才生效
    border_width: 0                         # 外框边框宽度，大于圆角半
    shadow_size: 4                          # 高亮候选词投影大小
    surrounding_extra_expansion: 0          # 设置了 canditate_back_color 后，调节非高亮候选词背景相对于高亮背景的大小
    color_space: display_p3                 # 颜色空间
    color_scheme: purity_of_essence
    color_scheme_dark: purity_of_form
  