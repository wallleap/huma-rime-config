
# https://github.com/rime/squirrel/wiki
patch:
  # keyboard_layout: zh-Hans-CN             # 键盘布局：last | default | 等
  show_notifications_when: always         # 显示切换方案或开关状态时的通知：always 总是，never 从不，appropriate 合适时
  show_notifications_via_notification_center: true # 使用系统通知中心显示通知
  # chord_duration: 0.1                     # 连击时长，单位秒
  # 应用程序选项：ascii_mode 初始为西文模式，no_inline 不使用行内编辑
  #   inline 强制使用行内编辑，vim_mode 退出 Vim 插入模式自动切换输入法状态
  # app_options: {}
  app_options:
    com.apple.Spotlight:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
      vim_mode: true
      inline: true
    com.googlecode.iterm2:
      ascii_mode: true
      vim_mode: true
      inline: true
    com.raycast.macos:
      ascii_mode: true
    org.vim.MacVim:
      ascii_mode: true  # 初始爲西文模式
      no_inline: true   # 不使用行內編輯
      vim_mode: true    # 退出VIM插入模式自動切換輸入法狀態

  preset_color_schemes:
    purity_of_essence:
      name: 純粹的本質／Purity of Essence
      author: 佛振
      showPaging: false
      memorize_size: false
      inline_preedit: false
      inline_candidate: false
      corner_radius: 12
      border_height: -2e+0
      border_width: -2
      hilited_corner_radius: 12
      hilited_border_height: 2
      surrounding_extra_expansion: 0
      line_spacing: 1.2
      spacing: -4
      base_offset: -6.5
      shadow_size: 4
      color-space: display_p3
      back_color: '0x7FFFFFFF'              # 整体背景色，可以包含透明度
      border_color: '0x03152079'            # 边框颜色
      # preedit_back_color: '0x7FFFFFFF'      # 预编辑区背景色
      text_color: '0x243ADC'                # 编辑区非高亮编码颜色
