# Rime schema info: info.yaml 方案信息（超越输入法下使用）
# encoding: utf-8

name: 虎码小鹤
author: vonnelu
version: 1.0.3
description: 方案主体来自 虎码秃码
url: https://github.com/wallleap/huma-rime-config
create_time: 2025-12-27
update_time: 2026-01-31
# 支持的设备。有指定的只取指定的，没指定的取全部
supported_devices:
  pc: ["tiger", "tiger_flypy_mix", "tigress", "fly_double_pinyin"]
# 方案使用主题
use_theme:
  # 如果没有自定义主题，则使用默认主题.
  # 右边的值是主题的目录名，也可以是方案下的主题名。需要绝对路径。
  # 例如: 在方案目录下，rime_ice/themes/default 是默认主题。
  # 在主题目录下，themes/default 是默认主题。
  default: "themes/default"
  # 自定义主题
  custom:
    # 自定义主题的名称，路径同上。
    "tiger": "huma_rime_config/themes/t26_pure"
    "tiger_flypy_mix": "huma_rime_config/themes/t26_pure"
    "tigress": "huma_rime_config/themes/t26_pure"
    "fly_double_pinyin": "huma_rime_config/themes/t26_pure"
