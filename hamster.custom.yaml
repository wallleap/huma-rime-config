# Hamster settings path: hamster.custom.yaml 仓输入法设置补丁
# encoding: utf-8

patch:
  # 下面兩行是導入自定義配色方案文件
  # keyboard/colorSchemas:
  #   __include: custom_color_schemas:/keyboard/colorSchemas
  # 下面兩行是導入自定義鍵盤佈局文件, 如果使用倉UI導入則不需要這兩行
  # keyboards:
  #   __include: custom_keyboards:/keyboards
  keyboard:
    style:
      # 需要把 fonts 中的字体上传到仓输入法的 /Fonts 中
      fontFace:
        - url: "Consolas.ttf"
        - url: "SegoeUIEmoji.ttf"
        - url: "NotoColorEmoji-Regular.ttf"
        - url: "TumanPUA.ttf"
        - url: "LXGWWenKaiGBScreen.ttf"
        - url: "simsun.ttc"
        - url: "simsunb.ttf"
        - url: "simsung.ttf"
        - url: "TH-Tshyn-P0.ttf"
        - url: "TH-Tshyn-P1.ttf"
        - url: "TH-Tshyn-P2.ttf"
        - url: "TH-Tshyn-P16.ttf"
        - url: "TH-Times.ttc"
