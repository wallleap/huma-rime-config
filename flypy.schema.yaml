# Rime schema
# encoding: utf-8
# based https://github.com/rime/rime-double-pinyin/blob/master/double_pinyin_flypy.schema.yaml

schema:
  schema_id: flypy
  name: 小鹤双拼
  version: "0.18"
  author:
    - 方案设计：何海峰 flypy.cc
    - Rime schema by 佛振 <chen.sst@gmail.com>
  description: |
    明月拼音＋小鹤双拼方案。
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: simplification # 简转繁滤镜
    reset: 0
    states: [简中, 繁中]
  - name: ascii_punct
    states: [。，, ．，]
  - name: pinyin # 拼音滤镜
    reset: 0
    states: [拼, pīn]
  - name: emoji_cn # emoji滤镜
    reset: 0
    states: [🈚, 🈶]
  - name: charset_comment_filter # 字符集提示
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@easy_english # 英文相关
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - table_translator@easy_english # 临时英文
    - reverse_lookup_translator # 反查翻译器
    - history_translator@historyDM # 历史上屏 电脑
    - history_translator@historyDM2 # 历史上屏 电脑2
    - history_translator@historyDM3 # 历史上屏 电脑3
    - history_translator@historySJ # 历史上屏 手机
    - lua_translator@number_translator # 数字转大写
    - lua_translator@calculator_translator # 简易计算器
  filters:
    - simplifier@simplification # 简繁滤镜
    - simplifier@pinyin # 拼音滤镜
    - simplifier@emoji_cn # 表情滤镜
    - lua_filter@charset_comment_filter # Unicode分区提示滤镜
    - lua_filter@lua_unicode_display_filter # Unicode编码显示
    - uniquifier # 过滤重复的候选字，可能来自简繁转换

speller:
  alphabet: "['zyxwvutsrqponmlkjihgfedcba]"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 万象词库转换
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/
    - xform/ḿ/m/
    # 小鹤双拼转换规则
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Q/
    - xform/(.)ei$/$1W/
    - xform/uan$/R/
    - xform/[uv]e$/T/
    - xform/un$/Y/
    - xform/^sh/U/
    - xform/^ch/I/
    - xform/^zh/V/
    - xform/uo$/O/
    - xform/ie$/P/
    - xform/i?ong$/S/
    - xform/ing$|uai$/K/
    - xform/(.)ai$/$1D/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/[iu]ang$/L/
    - xform/(.)ang$/$1H/
    - xform/ian$/M/
    - xform/(.)an$/$1J/
    - xform/(.)ou$/$1Z/
    - xform/[iu]a$/X/
    - xform/iao$/N/
    - xform/(.)ao$/$1C/
    - xform/ui$/V/
    - xform/in$/B/
    - xlit/QWRTYUIOPSDFGHJKLZXCVBNM/qwrtyuiopsdfghjklzxcvbnm/
    # 纯韵母补全（如 a → aa，o → oo，e → ee）
    - derive/^([aoe])$/$1$1/
    # 零声母韵母补全（如 i → ii，u → uu，v → vv，ü → vv）
    - derive/^([iuv])$/$1$1/
    # 纯声母补全（匹配以该声母开头的常用字，Rime自动补全韵母）
    - derive/^([bpmfdtnlgkhjqxzcsrwy])$/$1/
    # 简拼
    - abbrev/^(.).+$/$1/

translator:
  dictionary: flypy
  prism: flypy
  user_dict: flypy # 在本地生成的用户词典名称
  db_class: userdb # 用户词典格式，tabledb（文本） 或 userdb （二进制）
  initial_quality: 1 #该翻译器出字优先级别
  enable_user_dict: true # 开启用户词典〔用户词典记录动态字词频、用户词〕
  enable_encoder: true # 开启自动造词
  strict_spelling: false # 严格拼写
  enable_sentence: false # 是否开启自动造句
  enable_completion: false # 编码提示 true 开启  false 关闭
  encode_commit_history: true # 是否对已上屏的词自动造词
  max_phrase_length: 99 #自动造词的最长字数
  comment_format: # 提示码自定义
    - "xform/~/ /" # 去掉编码提示前的~号
    - "xform/^/ /" # 去掉编码提示后的空号
    - "xform/&nbsp;/ /" # 去掉空格
  preedit_format: # 上屏码自定义
    - xform/([nl])v/$1ü/ # 拼音状态下输入nv实际显示nü
    - xform/([nl])ue/$1üe/ # n或者l后面紧跟着输入ue显示üe
    - xform/([jqxy])v/$1u/ # j q x y 后面紧跟着输入v 实际显示u

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - xform/([nl])v/$1ü/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 100

punctuator:
  import_preset: symbols

key_binder:
  # import_preset: default
  bindings: # 设置功能性快捷键
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/select_candidate
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/paging_with_brackets
      - key_bindings:/windows_compatible_mode_switch
      - key_bindings:/tiger_pc_options
      # - key_bindings:/tiger_mobile_options

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    easy_english: "^'[A-Z|a-z]*`?$"
    expression: "^=.*$"
    reverse_lookup: "`[a-z]*'?$"

historyDM:
  input: "["
  size: 1
  initial_quality: 999

historyDM2:
  input: "'"
  size: 1
  initial_quality: -999

historyDM3:
  input: "]"
  size: 1
  initial_quality: 999

# ↓简繁(+部分异体)滤镜
simplification: #⇩四选一
  opencc_config: st_tu.json # 简 ➡ 繁（秃版CC标准）
  # opencc_config: s2tw.json # 简 ➡ 台湾正体
  # opencc_config: s2hk.json # 简 ➡ 香港繁体
  # opencc_config: s2twp.json # 简 ➡ 台湾正体（含常用词汇如：软体→軟體、鼠标→滑鼠）
  option_name: simplification
  tips: all # 转换文字段 all字词|char字

# ↓拼音滤镜
pinyin:
  opencc_config: pinyin.json
  option_name: pinyin
  show_in_comment: true # 作为注解在后面显示
  comment_format:
    - "xform/&nbsp;/ /"
    - "xform/^/ /"
  tips: char
  tags:
    - abc
    - reverse_lookup

# ↓emoji表情滤镜
emoji_cn:
  opencc_config: emoji.json
  option_name: emoji_cn
  tips: all

# 临时英文
easy_english:
  dictionary: easy_english
  tag: easy_english
  prefix: "'"
  tips: 〔En〕
  enable_completion: true
  enable_sentence: false
  initial_quality: -1
  preedit_format:
    - "xlit|_| |"
  comment_format: #去掉编码提示前的~号
    - "xform/~/ /"

menu:
  page_size: 5
