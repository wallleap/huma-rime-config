# custom settings
# encoding: utf-8

# 自定义键盘布局
custom:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  default:
    name: default
    ascii_mode: 0
    height: 46
    height_land: 34
    horizontal_gap: 4
    vertical_gap: 6
    vertical_gap_land: 3
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 4
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 5
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 1
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    preview: true
    shadow: { radius: 0, offsetX: 0, offsetY: 0, color: "#90949C" }
    menu: { events: [
            eisu_toggle_emoji, # 显示emoji表情选择器
            function_common_speech_recognition, # 点击语音输入
            eisu_toggle_keyboard_english, # 切换到英文键盘
            eisu_toggle_clip_board, # 打开剪切板
            eisu_toggle_edit_setting, # 切换编辑设置
            function_rime_switcher, # Rime输入法切换器
          ] }
    #现在只支持配置click,swipe_up,swipe_down键盘
    keys:
      # 1
      - {
          click: q,
          label: Q,
          swipe_up: send_1,
          swipe_down: tiger_Q,
          long_click: [commit_q, commit_1, "一", commit_Q],
        }
      - {
          click: w,
          label: W,
          swipe_up: send_2,
          swipe_down: tiger_W,
          long_click: [commit_w, commit_2, "二", commit_W],
        }
      - {
          click: e,
          label: E,
          swipe_up: send_3,
          swipe_down: tiger_E,
          long_click: [commit_e, commit_3, "三", commit_E],
        }
      - {
          click: r,
          label: R,
          swipe_up: send_4,
          swipe_down: tiger_R,
          long_click: [commit_r, commit_4, "四", commit_R],
        }
      - {
          click: t,
          label: T,
          swipe_up: send_5,
          swipe_down: tiger_T,
          long_click: [commit_t, commit_5, "五", commit_T],
        }
      - {
          click: y,
          label: Y,
          swipe_up: send_6,
          swipe_down: tiger_Y,
          long_click: [commit_y, commit_6, "六", commit_Y],
        }
      - {
          click: u,
          label: U,
          swipe_up: send_7,
          swipe_down: tiger_U,
          long_click: [commit_u, commit_7, "七", commit_U],
        }
      - {
          click: i,
          label: I,
          swipe_up: send_8,
          swipe_down: tiger_I,
          long_click: [commit_i, commit_8, "八", commit_I],
        }
      - {
          click: o,
          label: O,
          swipe_up: send_9,
          swipe_down: tiger_O,
          long_click: [commit_o, commit_9, "九", commit_O],
        }
      - {
          click: p,
          label: P,
          swipe_up: send_0,
          swipe_down: tiger_P,
          long_click: [commit_p, commit_0, "零", "〇", commit_P],
        }
      #2
      - { width: 5 }
      - {
          click: a,
          label: A,
          swipe_up: "~",
          swipe_down: tiger_A,
          long_click: [commit_a, commit_tilde, commit_A],
        }
      - {
          click: s,
          label: S,
          swipe_up: "/",
          swipe_down: tiger_S,
          long_click: [commit_s, commit_halfslash, commit_S],
        }
      - {
          click: d,
          label: D,
          swipe_up: ":",
          swipe_down: tiger_D,
          long_click: [commit_d, commit_fullcolon, commit_D],
        }
      - {
          click: f,
          label: F,
          swipe_up: ";",
          swipe_down: tiger_F,
          long_click: [commit_f, commit_fullsemicolon, commit_F],
        }
      - {
          click: g,
          label: G,
          swipe_up: text_bracket,
          swipe_down: tiger_G,
          long_click:
            [commit_g, send_left_bracket, send_right_bracket, commit_G],
        }
      - {
          click: h,
          label: H,
          swipe_up: "——",
          swipe_down: tiger_H,
          long_click: [commit_h, "_", commit_H],
        }
      - {
          click: j,
          label: J,
          swipe_up: "@",
          swipe_down: tiger_J,
          long_click: [commit_j, commit_halfat, commit_J],
        }
      - {
          click: k,
          label: K,
          swipe_up: text_quote,
          swipe_down: tiger_K,
          long_click: [commit_k, "“", "”", commit_K],
        }
      - {
          click: l,
          label: L,
          swipe_up: "=",
          swipe_down: tiger_L,
          long_click: [commit_l, commit_equal, commit_L],
        }
      - { width: 5 }
      #3
      - {
          click: shift,
          has_menu: text_delimiter,
          width: 15,
          name: shift,
          preview: false,
        }
      - {
          click: z,
          label: Z,
          swipe_up: send_grave,
          swipe_down: tiger_Z,
          long_click: [commit_z, commit_grave, commit_Z],
        }
      - {
          click: x,
          label: X,
          swipe_up: "*",
          swipe_down: tiger_X,
          long_click: [commit_x, commit_half_asterisk, commit_X],
        }
      - {
          click: c,
          label: C,
          swipe_up: "#",
          swipe_down: tiger_C,
          long_click: [commit_c, commit_halfpoundsign, commit_C],
        }
      - {
          click: v,
          label: V,
          swipe_up: "?",
          swipe_down: tiger_V,
          long_click: [commit_v, commit_fullquestionmark, commit_V],
        }
      - {
          click: b,
          label: B,
          swipe_up: "!",
          swipe_down: tiger_B,
          long_click: [commit_b, commit_fullexclamationpoint, commit_B],
        }
      - {
          click: n,
          label: N,
          swipe_up: "，",
          swipe_down: tiger_N,
          long_click: [commit_n, commit_half_comma, commit_N],
        }
      - {
          click: m,
          label: M,
          swipe_up: "。",
          swipe_down: tiger_M,
          long_click: [commit_m, commit_halfperiod, commit_M],
        }
      - {
          click: backspace,
          width: 15,
          name: backspace,
          preview: false,
          swipe_up: function_keyboard_clearAll,
          swipe_down: function_keyboard_undo,
        }
      #4
      - {
          click: eisu_toggle_符_symbols,
          width: 15,
          name: symbol,
          preview: false,
        }
      - {
          click: eisu_toggle_123_number,
          has_menu: text_halfperiod,
          width: 15,
          name: number,
          preview: false,
        }
      - {
          click: space,
          width: 36,
          name: space,
          swipe_up: select_second,
          swipe_down: Tab,
          preview: false,
        }
      - {
          click: eisu_toggle_keyboard_english_schema_easy_english,
          has_menu: text_halfcomma,
          width: 12,
          name: english,
          preview: false,
        }
      - {
          click: return,
          width: 22,
          name: return,
          swipe_up: select_third,
          composing: confirm,
          long_click:
            [
              function_keyboard_clearAll,
              function_keyboard_clearLeft,
              function_keyboard_clearRight,
              function_keyboard_undo,
              function_keyboard_redo,
              next,
            ],
          rect_preview: true,
          preview: false,
        }
    width: 10
  default_sm_md:
    vertical_gap: 3
    height: 31
    key_text_offset_x: 0
    key_text_offset_y: 3
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
