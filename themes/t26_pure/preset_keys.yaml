# custom settings
# encoding: utf-8

# 自定义按键
custom:
  __include: ./../public/preset_keys/default:/preset_keys
  # ` 符号
  send_grave: { label: "`", send: grave }
  commit_grave: { label: "`", commit: "`" }
  # ~
  commit_tilde: { label: "~", commit: "~" }
  # =
  commit_equal: { label: "=", commit: "=" }
  # *
  commit_half_asterisk: { label: "*", commit: "*" }
  # ()
  text_half_bracket: { label: "()", text: "(){Left}" }
  send_left_bracket: { label: "(", send: "(" }
  send_right_bracket: { label: ")", send: ")" }
  # ""
  text_quote: { label: '""', text: '""{Left}' }
  # '
  text_delimiter: { label: "'", text: "'" }
  # 数字
  send_1: { label: "1", send: "1" }
  commit_1: { label: "1", commit: "1" }
  send_2: { label: "2", send: "2" }
  commit_2: { label: "2", commit: "2" }
  send_3: { label: "3", send: "3" }
  commit_3: { label: "3", commit: "3" }
  send_4: { label: "4", send: "4" }
  commit_4: { label: "4", commit: "4" }
  send_5: { label: "5", send: "5" }
  commit_5: { label: "5", commit: "5" }
  send_6: { label: "6", send: "6" }
  commit_6: { label: "6", commit: "6" }
  send_7: { label: "7", send: "7" }
  commit_7: { label: "7", commit: "7" }
  send_8: { label: "8", send: "8" }
  commit_8: { label: "8", commit: "8" }
  send_9: { label: "9", send: "9" }
  commit_9: { label: "9", commit: "9" }
  send_0: { label: "0", send: "0" }
  commit_0: { label: "0", commit: "0" }
  # 功能函数
  function_keyboard_my_selectAll:
    {
      icon: "smart_selection_area.svg",
      label: "全选",
      send: function,
      command: keyboard.selectAll,
      option: "",
    }
  function_keyboard_my_cut:
    {
      icon: "cut.svg",
      label: "剪切",
      send: function,
      command: keyboard.cut,
      option: "",
    }
  function_keyboard_my_copy:
    {
      icon: "doc_plaintext_2.svg",
      label: "复制",
      send: function,
      command: keyboard.copy,
      option: "",
    }
  function_keyboard_my_paste:
    {
      icon: "text_clipboard.svg",
      label: "粘贴",
      send: function,
      command: keyboard.paste,
      option: "",
    }
  # 设置
  eisu_toggle_edit_setting:
    {
      icon: "rename.svg",
      label: "快捷编辑",
      send: Eisu_toggle,
      select: _setting_board,
      option:
        [
          function_keyboard_my_selectAll,
          function_keyboard_my_cut,
          function_keyboard_my_copy,
          function_keyboard_my_paste,
          function_keyboard_newline,
          function_keyboard_clearAll,
          function_keyboard_clearLeft,
          function_keyboard_clearRight,
          function_keyboard_undo,
          function_keyboard_redo,
          function_keyboard_deleteLeft,
          function_keyboard_deleteRight,
        ],
    }
  # 切换方案
  eisu_toggle_schema_english:
    {
      icon: "textformat.svg",
      label: "中文",
      send: Eisu_toggle,
      select: easy_english,
      option: schema,
    }
  eisu_toggle_schema_default:
    {
      icon: "textformat.svg",
      label: "英文",
      send: Eisu_toggle,
      select: .default,
      option: schema,
    }
  # 切换键盘
  eisu_toggle_keyboard_english:
    {
      icon: "keyboard_zh.svg",
      label: "中/英",
      send: Eisu_toggle,
      select: english,
    }
  eisu_toggle_keyboard_english_sm_md:
    {
      icon: "keyboard_zh.svg",
      label: "中/英",
      send: Eisu_toggle,
      select: english_sm_md,
    }
  eisu_toggle_keyboard_english_schema_easy_english:
    {
      icon: "keyboard_badge_globe.svg",
      label: "中/英",
      text: "{eisu_toggle_keyboard_english}{eisu_toggle_schema_english}",
    }
  eisu_toggle_keyboard_english_sm_md_schema_easy_english:
    {
      icon: "keyboard_badge_globe.svg",
      label: "中/英",
      text: "{eisu_toggle_keyboard_english_sm_md}{eisu_toggle_schema_english}",
    }
  eisu_toggle_keyboard_default:
    {
      icon: "keyboard_en.svg",
      label: "英/中",
      send: Eisu_toggle,
      select: default,
    }
  eisu_toggle_keyboard_default_sm_md:
    {
      icon: "keyboard_en.svg",
      label: "英/中",
      send: Eisu_toggle,
      select: default_sm_md,
    }

