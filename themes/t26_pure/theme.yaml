# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
  default:
    light: light # 竖屏
    light_land: light_land # 横屏
    dark: dark # 竖屏
    dark_land: dark_land # 横屏
    keyboards: [default, english, number, symbols] # 手机和 pad 需要配置。键盘配置：自动键盘、字母、数字、符号
  hmos:
    # default
    light: light # 竖屏
    dark: dark # 竖屏
    # land
    light_land: light_land # 横屏
    dark_land: dark_land # 横屏
    # sd_md 小屏幕。如：pura X 外屏
    light_sm_md: light_sm_md # 竖屏
    dark_sm_md: dark_sm_md # 竖屏
    keyboards: [default, english, number, symbols] # 手机和pad需要配置。键盘配置：自动键盘、字母、数字、符号
    keyboards_land: [default_land, english, number_land, symbols] # 横屏
  iOS:
    light: light # 竖屏
    light_land: light_land # 横屏
    dark: dark # 竖屏
    dark_land: dark_land # 横屏
    keyboards: [default, english, number, symbols] # 手机和 pad 需要配置。键盘配置：自动键盘、字母、数字、符号
  iPadOS:
    light: default
    dark: default
  macOS:
    light: default
    dark: default
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
  default:
    color_schema: default
    candidate: default
    font: default
  light:
    color_schema: default
    candidate: default
    font: default
  light_land:
    color_schema: default
    candidate: default_land
    font: default
  light_sm_md:
    color_schema: default
    candidate: default_sm_md
    font: default_sm_md
    keyboards: [default_sm_md, english_sm_md, number_sm_md, symbols_sm_md] # 手机和 pad 需要配置。键盘配置：自动键盘、字母、数字、符号
  dark_sm_md:
    color_schema: default
    candidate: default_sm_md
    font: default_sm_md
    keyboards: [default_sm_md, english_sm_md, number_sm_md, symbols_sm_md] # 手机和 pad 需要配置。键盘配置：自动键盘、字母、数字、符号
  dark:
    color_schema: dark
    candidate: default
    font: default
  dark_land:
    color_schema: dark
    candidate: default_land
    font: default
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
  default:
    margin: 5 # 候选项外边距
    padding: 5 # 候选项内边距
    spacing: 8 # 候选间距
    use_cursor: true # 高亮候选项
    candidate_view_height: 51 # 候选区高度
    comment_height: 12 # 编码提示区高度
    comment_on_top: true # 编码提示在上方或右侧
    text_height: 20 # 编码区高度
    more_button_width: 44 # 更多按钮宽度
    corner_radius: 6 # 圆角半径
    hilited_corner_radius: 6 # 高亮圆角半径
    view_height: 28 # 候选区高度
    specified_name:
      candidate_text_collection_view:
        candidate_view_height: 44 # 候选区高度
      candidate_tools:
        more_button_width: 64
      candidate_menu:
        spacing: 28
  default_land:
    candidate_view_height: 44 # 候选区高度
    text_height: 0 # 编码区高度
  default_sm_md:
    candidate_view_height: 44 # 候选区高度
    text_height: 0 # 编码区高度
preset_fonts:
  __include: ./preset_fonts:/custom
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./preset_keys:/custom
preset_keyboards:
  __include: ./preset_keyboards:/custom
